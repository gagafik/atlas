name: Atlas checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: atlas-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
          cache: npm
      - run: python tools/check_repository.py
      - run: pip install -r requirements.lock.txt
      - run: python -m pytest -q
      - run: npm ci
      - run: npm test
      - run: npm run build
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Validate deployment configuration
        run: ATLAS_DOMAIN=atlas.example.org ACME_EMAIL=admin@example.org docker compose config --quiet
      - name: Build image
        run: docker build -t atlas:ci .
      - name: Refuse unconfigured server
        run: |
          if docker run --rm atlas:ci python -m tools.serve --check; then
            echo "Unconfigured server was accepted"; exit 1
          fi
      - name: Bootstrap isolated test volume
        run: |
          docker volume create atlas-ci
          docker run --rm -v atlas-ci:/app/data atlas:ci python -c 'from tools.create_admin import create_first_admin; create_first_admin("ci-admin", "CI administrator", "Only-for-isolated-CI-2026!")'
      - name: Start and verify authenticated server
        run: |
          docker run -d --name atlas-ci-app -p 127.0.0.1:8000:8000 -v atlas-ci:/app/data atlas:ci
          for attempt in $(seq 1 30); do
            if curl --silent --fail http://127.0.0.1:8000/api/health; then break; fi
            sleep 2
          done
          curl --fail http://127.0.0.1:8000/ > /dev/null
          test "$(curl --silent -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/state)" = "401"
          docker exec atlas-ci-app python -c 'import httpx; c=httpx.Client(base_url="http://127.0.0.1:8000",trust_env=False); r=c.post("/api/auth/login",headers={"X-Atlas-Request":"1"},json={"login":"ci-admin","password":"Only-for-isolated-CI-2026!"}); r.raise_for_status(); c.get("/api/state?workspace=demo").raise_for_status()'
          curl --fail http://127.0.0.1:8000/api/ready
      - name: Verify backup and isolated restore in non-root container
        id: backup_smoke
        run: |
          docker volume create atlas-ci-backups
          docker run --rm -v atlas-ci:/app/data -v atlas-ci-backups:/app/backups -e ATLAS_BACKUP_DIR=/app/backups atlas:ci python -m tools.backup_service --once
      - name: Diagnose synthetic backup failure
        if: failure() && steps.backup_smoke.outcome == 'failure'
        run: |
          docker run --rm -v atlas-ci:/app/data atlas:ci python -c 'from pathlib import Path; import tempfile,sqlite3; from tools.backup_school import create_backup; from tools.restore_school import verify_backup; print("SQLite",sqlite3.sqlite_version,flush=True); snapshot=Path(tempfile.mkdtemp())/"snapshot"; create_backup(Path("/app/data/timetable.db"),snapshot); verify_backup(snapshot)'
      - name: Container logs
        if: failure()
        run: docker logs atlas-ci-app || true
      - name: Clean CI containers
        if: always()
        run: |
          docker rm -f atlas-ci-app || true
          docker volume rm atlas-ci || true
          docker volume rm atlas-ci-backups || true
