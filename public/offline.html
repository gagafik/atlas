<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#083a81" />
    <title>Атлас · Подключение</title>
    <style>
      /* Standalone page: it cannot load the app's stylesheet, so it repeats the brand tokens (see DESIGN.md). */
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #f3f5f9;
        color: #231f20;
        font:
          500 17px/1.6 "Montserrat Variable",
          "Montserrat",
          "Segoe UI",
          system-ui,
          sans-serif;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      main {
        max-width: 520px;
        padding: 30px;
        border-radius: 4px;
        background: #fefefe;
        border: 1px solid #dcdfe4;
      }
      h1 {
        font-size: 32px;
        font-weight: 800;
        margin: 12px 0;
      }
      img {
        width: 64px;
        height: 64px;
        border-radius: 4px;
      }
      button {
        padding: 13px 20px;
        background: #083a81;
        color: #fefefe;
        border: 0;
        border-radius: 4px;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:hover {
        background: #226bd1;
      }
      button:focus-visible {
        outline: 3px solid #226bd1;
        outline-offset: 2px;
      }
      p {
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/atlas-192.png" alt="" />
      <h1>Нет подключения к Атласу</h1>
      <p>
        Проверьте сеть и убедитесь, что сервер школы работает. Затем повторите
        подключение.
      </p>
      <p>
        Для открытия расписания нужно соединение с сервером. Школьные данные на
        этом экране не сохраняются.
      </p>
      <button id="retry">Подключиться снова</button>
    </main>
    <script>
      document
        .getElementById("retry")
        .addEventListener("click", () => location.reload());
      window.addEventListener("online", () => location.reload());
    </script>
  </body>
</html>
